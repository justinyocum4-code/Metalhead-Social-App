name: Build Metalhead Social APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0)'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Version code - must be a whole number bigger than last time'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'What changed in this version (shown in the store)'
        required: false
        type: string
        default: ''

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ inputs.version_name || '1.0' }}
      APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
      APP_RELEASE_NOTES: ${{ inputs.release_notes || 'Update' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Scaffold Android project
        run: |
          echo "=== Files in repo ==="
          ls -la
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: index.html was not found in the repository root."
            echo "Upload index.html to the repository root first (Add file > Upload files), then re-run this workflow."
            exit 1
          fi
          echo "Using $HTML_FILE as the app page."
          if ! grep -q 'id="metalheads-app"' "$HTML_FILE"; then
            echo "ERROR: $HTML_FILE is not the Metalhead Social file (metalheads-app marker missing)."
            echo "Upload the Metalhead Social index.html to the repository root, then re-run this workflow."
            exit 1
          fi

          mkdir -p app/src/main/java/com/metalheadsocial/app app/src/main/assets/www

          cp "$HTML_FILE" app/src/main/assets/www/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MetalheadSocialApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.metalheadsocial.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.metalheadsocial.app'
                  minSdk 24
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:label="Metalhead Social"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.metalheadsocial.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.metalheadsocial.app" android:host="auth-callback" />
                      </intent-filter>
                  </activity>
                  <receiver
                      android:name="com.metalheadsocial.app.MessageCheckReceiver"
                      android:exported="false" />
                  <receiver
                      android:name="com.metalheadsocial.app.BootReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/metalheadsocial/app/MainActivity.java <<'EOF'
          package com.metalheadsocial.app;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private String pendingTts = null;
              private boolean pageLoaded = false;
              private String pendingAuthUrl = null;
              private ValueCallback<Uri[]> filePathCallback = null;
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private long storeDownloadId = -1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{ android.Manifest.permission.RECORD_AUDIO }, 2002);
                  }
                  MessageCheckReceiver.schedule(this);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowFileAccessFromFileURLs(true);
                  webView.getSettings().setAllowUniversalAccessFromFileURLs(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          pageLoaded = true;
                          if (pendingAuthUrl != null) {
                              String u = pendingAuthUrl;
                              pendingAuthUrl = null;
                              deliverAuthUrl(u);
                          }
                      }
                  });
                  final Activity self = this;
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override public void run() { request.grant(request.getResources()); }
                          });
                      }
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) { filePathCallback.onReceiveValue(null); }
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          try {
                              self.startActivityForResult(Intent.createChooser(intent, "Choose a photo"), FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void set(String key, String value) {
                          try {
                              getSharedPreferences("metalhead_social", MODE_PRIVATE).edit().putString(key, value).commit();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public String get(String key) {
                          try {
                              return getSharedPreferences("metalhead_social", MODE_PRIVATE).getString(key, null);
                          } catch (Exception e) {
                              return null;
                          }
                      }
                      @JavascriptInterface
                      public void remove(String key) {
                          try {
                              getSharedPreferences("metalhead_social", MODE_PRIVATE).edit().remove(key).commit();
                          } catch (Exception ignored) {}
                      }
                  }, "LynxosStore");
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status == TextToSpeech.SUCCESS) {
                              try {
                                  int result = tts.setLanguage(Locale.US);
                                  ttsReady = result != TextToSpeech.LANG_MISSING_DATA && result != TextToSpeech.LANG_NOT_SUPPORTED;
                              } catch (Exception e) {
                                  ttsReady = false;
                              }
                              if (ttsReady && pendingTts != null) {
                                  String text = pendingTts;
                                  pendingTts = null;
                                  try {
                                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "metalhead-reader");
                                  } catch (Exception ignored) {}
                              }
                          }
                      }
                  });
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void speak(String text) {
                          if (text == null) return;
                          if (ttsReady && tts != null) {
                              try {
                                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "metalhead-reader");
                              } catch (Exception ignored) {}
                          } else {
                              pendingTts = text;
                          }
                      }
                      @JavascriptInterface
                      public void stop() {
                          pendingTts = null;
                          try {
                              if (tts != null) tts.stop();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public void cancel() {
                          stop();
                      }
                  }, "LynxosTts");
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void requestExemption() {
                          self.runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                              Uri.parse("package:" + getPackageName()));
                                      startActivity(i);
                                  } catch (Exception e) {
                                      try {
                                          startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                                      } catch (Exception ignored) {}
                                  }
                              }
                          });
                      }
                  }, "LynxosBattery");
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void open(final String url) {
                          self.runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(i);
                                  } catch (Exception ignored) {}
                              }
                          });
                      }
                  }, "LynxosBrowser");
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void share(final String title, final String text, final String url) {
                          self.runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      Intent send = new Intent(Intent.ACTION_SEND);
                                      send.setType("text/plain");
                                      send.putExtra(Intent.EXTRA_SUBJECT, title);
                                      send.putExtra(Intent.EXTRA_TEXT, text + "\n" + url);
                                      startActivity(Intent.createChooser(send, "Share Metalhead Social"));
                                  } catch (Exception ignored) {}
                              }
                          });
                      }
                  }, "LynxosShare");
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void download(final String url, final String fileName) {
                          self.runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                                      req.setTitle(fileName);
                                      req.setDescription("Downloading " + fileName);
                                      req.setMimeType("application/vnd.android.package-archive");
                                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                                      storeDownloadId = dm.enqueue(req);
                                  } catch (Exception ignored) {}
                              }
                          });
                      }
                  }, "LynxosDownloader");
                  // When the store APK finishes downloading, pop the installer automatically.
                  try {
                      BroadcastReceiver dlDone = new BroadcastReceiver() {
                          @Override
                          public void onReceive(Context ctx, Intent intent) {
                              try {
                                  long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
                                  if (id == -1 || id != storeDownloadId) return;
                                  DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                                  DownloadManager.Query q = new DownloadManager.Query();
                                  q.setFilterById(id);
                                  Cursor c = dm.query(q);
                                  boolean ok = false;
                                  if (c != null) {
                                      if (c.moveToFirst()) {
                                          int sIdx = c.getColumnIndex(DownloadManager.COLUMN_STATUS);
                                          ok = (sIdx != -1 && c.getInt(sIdx) == DownloadManager.STATUS_SUCCESSFUL);
                                      }
                                      c.close();
                                  }
                                  if (!ok) return;
                                  Uri uri = dm.getUriForDownloadedFile(id);
                                  if (uri == null) return;
                                  Intent install = new Intent(Intent.ACTION_VIEW);
                                  install.setDataAndType(uri, "application/vnd.android.package-archive");
                                  install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(install);
                              } catch (Exception ignored) {}
                          }
                      };
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(dlDone, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), Context.RECEIVER_NOT_EXPORTED);
                      } else {
                          registerReceiver(dlDone, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE));
                      }
                  } catch (Exception ignored) {}
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void exitApp() {
                          try {
                              MainActivity.this.runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      try { MainActivity.this.finish(); } catch (Exception ignored) {}
                                  }
                              });
                          } catch (Exception ignored) {}
                      }
                  }, "LynxosBack");
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("file:///android_asset/www/index.html");
                  }
                  setContentView(webView);
                  handleAuthIntent(getIntent());
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                          results = new Uri[]{ data.getData() };
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              private void handleAuthIntent(Intent intent) {
                  try {
                      if (intent == null || intent.getData() == null) return;
                      String d = intent.getDataString();
                      if (d != null && d.startsWith("com.metalheadsocial.app://auth-callback")) {
                          if (pageLoaded) {
                              deliverAuthUrl(d);
                          } else {
                              pendingAuthUrl = d;
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void deliverAuthUrl(final String url) {
                  try {
                      final String esc = url.replace("\\", "\\\\").replace("'", "\\'");
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (webView != null) {
                                      webView.evaluateJavascript("window.__handleAuthCallback('" + esc + "')", null);
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  try { setIntent(intent); } catch (Exception ignored) {}
                  handleAuthIntent(intent);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              private void defaultBackPressed() {
                  super.onBackPressed();
              }

              @Override
              public void onBackPressed() {
                  // Let the page handle back navigation first (popups, chat room, app sections).
                  // The page calls LynxosBack.exitApp() only when there is nowhere left to go.
                  if (webView == null) {
                      defaultBackPressed();
                      return;
                  }
                  try {
                      webView.evaluateJavascript(
                          "(function(){try{return (typeof window.__lynxosOnBack==='function')?'1':'0';}catch(e){return '0';}})()",
                          value -> {
                              try {
                                  if ("\"1\"".equals(value)) {
                                      webView.evaluateJavascript("window.__lynxosOnBack()", null);
                                  } else if (webView.canGoBack()) {
                                      webView.goBack();
                                  } else {
                                      MainActivity.this.defaultBackPressed();
                                  }
                              } catch (Exception ignored) {
                                  try { MainActivity.this.defaultBackPressed(); } catch (Exception ignored2) {}
                              }
                          });
                  } catch (Exception e) {
                      defaultBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      try {
                          tts.stop();
                          tts.shutdown();
                      } catch (Exception ignored) {}
                      tts = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/metalheadsocial/app/MessageCheckReceiver.java <<'EOF'
          package com.metalheadsocial.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;

          public class MessageCheckReceiver extends BroadcastReceiver {
              private static final long INTERVAL_MS = 15L * 60L * 1000L;
              private static final String PREFS = "metalhead_social";
              private static final String CHANNEL_ID = "metalhead-alerts";
              private static final String SUPABASE_URL = "https://klykzghndlrfwwxwaczm.supabase.co";
              private static final String SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtseWt6Z2huZGxyZnd3eHdhY3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MzUxNDUsImV4cCI6MjEwNTExMTE0NX0.02AcmkbA_wjLN5XOfwuisJjck2TijjqH66bX5ddVV0Q";

              public static void schedule(Context ctx) {
                  try {
                      AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      Intent i = new Intent(ctx, MessageCheckReceiver.class);
                      PendingIntent pi = PendingIntent.getBroadcast(ctx, 0, i,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      long trigger = System.currentTimeMillis() + INTERVAL_MS;
                      am.setInexactRepeating(AlarmManager.RTC_WAKEUP, trigger, INTERVAL_MS, pi);
                  } catch (Exception ignored) {}
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  final PendingResult pr = goAsync();
                  final Context appCtx = context.getApplicationContext();
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              doCheck(appCtx);
                          } catch (Exception ignored) {
                          } finally {
                              try { schedule(appCtx); } catch (Exception ignored) {}
                              pr.finish();
                          }
                      }
                  }).start();
              }

              private void doCheck(Context ctx) {
                  SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  String userId = prefs.getString("mh_user_id", "");
                  String refreshToken = prefs.getString("mh_refresh_token", "");
                  if (userId == null || userId.length() == 0) return;
                  if (refreshToken == null || refreshToken.length() == 0) return;
                  String accessToken = refreshAccessToken(refreshToken);
                  if (accessToken == null) return;
                  List<String[]> unread = fetchUnread(userId, accessToken);
                  String maxSeen = prefs.getString("mh_max_notified_at", "");
                  if (maxSeen == null) maxSeen = "";
                  String newMax = maxSeen;
                  int fresh = 0;
                  boolean freshDm = false;
                  for (int i = 0; i < unread.size(); i++) {
                      String ca = unread.get(i)[0];
                      String type = unread.get(i)[1];
                      if (ca == null || ca.length() == 0) continue;
                      if (newMax.length() == 0 || ca.compareTo(newMax) > 0) newMax = ca;
                      if (maxSeen.length() > 0 && ca.compareTo(maxSeen) > 0) {
                          fresh++;
                          if ("dm".equals(type)) freshDm = true;
                      }
                  }
                  if (newMax.length() > 0) prefs.edit().putString("mh_max_notified_at", newMax).apply();
                  if (fresh == 1) {
                      notifyNew(ctx, "New activity in Metalhead Social",
                              freshDm ? "New message - tap to open" : "1 new alert - tap to open");
                  } else if (fresh > 1) {
                      notifyNew(ctx, "New activity in Metalhead Social", fresh + " new alerts - tap to open");
                  }
              }

              private String refreshAccessToken(String refreshToken) {
                  HttpURLConnection c = null;
                  try {
                      URL url = new URL(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token");
                      c = (HttpURLConnection) url.openConnection();
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(20000);
                      c.setRequestMethod("POST");
                      c.setDoOutput(true);
                      c.setRequestProperty("apikey", SUPABASE_ANON);
                      c.setRequestProperty("Content-Type", "application/json");
                      String safe = refreshToken.replace("\\", "\\\\").replace("\"", "\\\"");
                      byte[] body = ("{\"refresh_token\":\"" + safe + "\"}").getBytes("UTF-8");
                      OutputStream os = c.getOutputStream();
                      os.write(body);
                      os.flush();
                      os.close();
                      if (c.getResponseCode() != 200) return null;
                      String resp = readAll(c.getInputStream());
                      JSONObject d = new JSONObject(resp);
                      String at = d.optString("access_token", "");
                      return at.length() > 0 ? at : null;
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              private List<String[]> fetchUnread(String userId, String accessToken) {
                  List<String[]> out = new ArrayList<String[]>();
                  HttpURLConnection c = null;
                  try {
                      String q = SUPABASE_URL + "/rest/v1/notifications?user_id=eq." + URLEncoder.encode(userId, "UTF-8")
                              + "&read=eq.false&select=id,created_at,type&order=created_at.desc&limit=50";
                      URL url = new URL(q);
                      c = (HttpURLConnection) url.openConnection();
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(20000);
                      c.setRequestProperty("apikey", SUPABASE_ANON);
                      c.setRequestProperty("Authorization", "Bearer " + accessToken);
                      if (c.getResponseCode() != 200) return out;
                      JSONArray arr = new JSONArray(readAll(c.getInputStream()));
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          out.add(new String[]{ o.optString("created_at", ""), o.optString("type", "") });
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.disconnect();
                  }
                  return out;
              }

              private String readAll(InputStream in) throws Exception {
                  BufferedReader br = new BufferedReader(new InputStreamReader(in, "UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = br.readLine()) != null) sb.append(line);
                  br.close();
                  return sb.toString();
              }

              private void notifyNew(Context ctx, String title, String text) {
                  try {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "New activity", NotificationManager.IMPORTANCE_DEFAULT);
                          nm.createNotificationChannel(ch);
                      }
                      Intent open = new Intent(ctx, MainActivity.class);
                      open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent pi = PendingIntent.getActivity(ctx, 0, open,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      Notification.Builder nb = Build.VERSION.SDK_INT >= 26
                              ? new Notification.Builder(ctx, CHANNEL_ID)
                              : new Notification.Builder(ctx);
                      nb.setContentTitle(title)
                        .setContentText(text)
                        .setSmallIcon(android.R.drawable.ic_dialog_info)
                        .setContentIntent(pi)
                        .setAutoCancel(true);
                      nm.notify(2001, nb.build());
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat > app/src/main/java/com/metalheadsocial/app/BootReceiver.java <<'EOF'
          package com.metalheadsocial.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      MessageCheckReceiver.schedule(context.getApplicationContext());
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          KEY_B64='${{ secrets.KEYSTORE_BASE64 }}'
          echo "DIAG: KEYSTORE_BASE64 length = ${#KEY_B64} chars"
          echo "$KEY_B64" | tr -d '[:space:]' | base64 -d > /tmp/lynxos-release.p12
          if [ ! -s /tmp/lynxos-release.p12 ]; then
            echo "ERROR: signing key secret is empty or did not decode. Re-add the KEYSTORE_BASE64 secret."
            exit 1
          fi
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metalhead-social-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          body: ${{ env.APP_RELEASE_NOTES }}
          files: app/build/outputs/apk/release/app-release.apk
